<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="./icon-192.png" />
    <title>Uni Kasher — نظام إدارة الأعمال</title>
    <script>
      // Prevent theme flash: apply stored theme before first paint.
      try {
        var ui = JSON.parse(localStorage.getItem('pos-ui') || '{}')
        if (ui && ui.state && ui.state.theme === 'dark') {
          document.documentElement.classList.add('dark')
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/desktop/main.tsx"></script>
  </body>
</html>
