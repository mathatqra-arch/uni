[package]
name = "uni-kasher-pos"
version = "2.0.9"
description = "Uni Kasher POS - Business Management System"
authors = ["Uni Kasher"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
base64 = "0.22"
ed25519-dalek = { version = "2", features = ["std"] }
winreg = "0.55"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }
uuid = { version = "1", features = ["v4"] }
sqlx = { version = "0.8.6", default-features = false, features = ["sqlite", "runtime-tokio"] }

[features]
custom-protocol = ["tauri/custom-protocol"]
